# Native Zephyr device_next USB Audio Class 2 receiver profile.
CONFIG_USB_DEVICE_STACK=n
CONFIG_USB_CDC_ACM=n
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_AUDIO2_CLASS=y
CONFIG_USBD_CDC_ACM_CLASS=n
CONFIG_USBD_LOG_LEVEL_WRN=y
CONFIG_USBD_UAC2_LOG_LEVEL_DBG=y

# Use the vendored+patched src/uac2/udc_stm32.c instead of the in-tree driver
# (see src/uac2/README.md). MINIAUDIO_UAC2_UDC_STM32_FIX in the project's own
# ./Kconfig re-selects what CONFIG_UDC_STM32 would otherwise have selected
# (those symbols have no prompt and cannot be assigned directly here).
CONFIG_UDC_STM32=n
